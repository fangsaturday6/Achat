<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page" id="page" hidden></div>
<div class="app" id="app" hidden>
  <nav class="rail" aria-label="主导航">
    <a href="#/me" class="rail-me" id="nav-avatar" aria-label="我"></a>
    <a href="#/" id="nav-messages" class="rail-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-4 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
      <span class="label">消息</span>
      <span class="badge" id="messages-badge" hidden></span>
    </a>
    <a href="#/contacts" id="nav-contacts" class="rail-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM4 20c.8-3.6 4-6 8-6s7.2 2.4 8 6z"/></svg>
      <span class="label">通讯录</span>
      <span class="badge" id="contacts-badge" hidden></span>
    </a>
    <a href="#/me" id="nav-me" class="rail-btn narrow-only">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 16v4"/></svg>
      <span class="label">我</span>
    </a>
    <span class="rail-spacer"></span>
    <button type="button" class="rail-btn rail-settings" id="nav-settings" aria-label="设置" aria-expanded="false" aria-haspopup="menu" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </nav>
  <section class="list" id="list" aria-label="列表"></section>
  <main class="main" id="main"></main>
</div>
<script>window.ACHAT_TOKEN = "__ACHAT_TOKEN__";</script>
<script type="module" src="/app.js"></script>
</body>
</html>
